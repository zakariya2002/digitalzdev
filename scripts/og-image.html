<!doctype html>
<!--
  Gabarit de l'aperçu de lien (Open Graph), en 16:9.
  Reprend le haut de page : fond gris dégradé, titre en Inter Tight,
  « image. » en bleu. Rendu en PNG par scripts/generate-og-image.mjs.
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter Tight'; font-weight: 100 900; src: url('../public/fonts/inter-tight-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 100 900; src: url('../public/fonts/inter-tight-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA; }
  @font-face { font-family: 'Nunito'; font-weight: 200 1000; src: url('../public/fonts/nunito-latin.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 675px; overflow: hidden; }
  body {
    background: linear-gradient(#d6d6d6 0%, #fafafa 100%);
    font-family: 'Inter Tight', system-ui, sans-serif;
    color: #0f0f0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 44px 0 40px;
    text-align: center;
  }
  .marque {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 9px 20px 9px 10px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 14px;
    font-family: 'Nunito', system-ui, sans-serif;
    font-size: 21px;
  }
  .marque img { width: 36px; height: 36px; border-radius: 50%; }
  .centre { display: flex; flex-direction: column; align-items: center; }
  h1 {
    font-weight: 400;
    font-size: 92px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  h1 span { color: rgb(54 84 244); }
  .bouton {
    margin-top: 40px;
    display: inline-flex; align-items: center;
    height: 62px; padding: 0 42px;
    border-radius: 14px;
    background: #0f0f0f; color: #fff;
    font-size: 21px; letter-spacing: 0.01em;
  }
  .pied { display: flex; flex-direction: column; gap: 12px; }
  .metiers { font-size: 20px; color: #6b6b6b; }
  .domaine { font-size: 20px; }
</style>
</head>
<body>
  <div class="marque"><img src="../public/logo-studio.png" alt="" />Digitalz Dev</div>
  <div class="centre">
    <h1>Créons un site<br />à la hauteur de votre <span>image.</span></h1>
    <div class="bouton">Démarrer mon projet</div>
  </div>
  <div class="pied">
    <p class="metiers">Avocats · Architectes · Photographes</p>
    <p class="domaine">digitalzdev.com</p>
  </div>
</body>
</html>
